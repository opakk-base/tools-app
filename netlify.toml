[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund --include=dev"

[context.production]
  command = "npm install --include=dev --no-audit --no-fund && npm run build"

[context.deploy-preview]
  command = "npm install --include=dev --no-audit --no-fund && npm run build"
